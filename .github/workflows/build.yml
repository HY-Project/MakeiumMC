# Makeium: ONE pure-Java mod jar for NeoForge + Fabric (build/libs/makeium-<version>+mc26.3.jar). No executables.
name: build

on:
  push:
    # One branch per Minecraft version (mc-26.3, ...); the default branch is the latest stable one.
    branches: ['mc-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  jar:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      # Unit tests (wall snap, block compiler, path sanitising, packaging rules) and the universal jar.
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Jar contents
        run: |
          jar=$(ls build/libs/makeium-*+mc*.jar)
          unzip -Z1 "$jar" | grep -E 'META-INF/neoforge.mods.toml|fabric.mod.json|makeium.mixins.json|assets/makeium/lang/ko_kr.json'
          if unzip -Z1 "$jar" | grep -iE '\.(exe|dll|so|dylib)$'; then echo "::error::native files in the jar"; exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: makeium
          path: build/libs/makeium-*.jar
          if-no-files-found: error
